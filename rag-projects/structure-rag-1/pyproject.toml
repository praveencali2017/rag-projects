[project]
name = "structured-rag"
version = "0.1.0"
description = "Text-to-SQL RAG agent that answers natural-language questions over the Chinook SQLite database using LangChain and OpenAI"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.4.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
]
